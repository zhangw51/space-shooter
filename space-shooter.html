<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星空保卫战 · 太空射击</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(ellipse at 50% 30%, #0b1030 0%, #05060f 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    display: block;
    max-height: 94vh; max-width: 96vw; height: auto;
    background: #05060f;
    border: 1px solid #1c2340; border-radius: 10px;
    box-shadow: 0 0 80px rgba(60, 90, 255, .18), inset 0 0 40px rgba(20, 30, 80, .4);
    touch-action: none; cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ================= 基础 ================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 480, H = 720;
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ================= 音效(合成,无外部文件) ================= */
const SFX = {
  ac: null, muted: false,
  ensure() {
    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  tone(freq, dur, type, vol, slide) {
    if (!this.ac || this.muted) return;
    type = type || 'square'; vol = vol || .12; slide = slide || 0;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination);
    o.start(t); o.stop(t + dur);
  },
  noise(dur, vol) {
    if (!this.ac || this.muted) return;
    dur = dur || .3; vol = vol || .2;
    const t = this.ac.currentTime;
    const n = (this.ac.sampleRate * dur) | 0;
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(); s.buffer = buf;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
    s.connect(f); f.connect(g); g.connect(this.ac.destination);
    s.start(t);
  },
  shoot()  { this.tone(880, .06, 'square', .04, -500); },
  boom()   { this.noise(.22, .18); this.tone(130, .22, 'sawtooth', .1, -90); },
  bigBoom(){ this.noise(.6, .32); this.tone(80, .6, 'sawtooth', .18, -55); },
  hit()    { this.tone(220, .18, 'sawtooth', .16, -160); this.noise(.15, .12); },
  power()  { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .12, 'triangle', .11), i * 70)); },
  waveS()  { [392, 523, 659].forEach((f, i) => setTimeout(() => this.tone(f, .15, 'triangle', .09), i * 90)); },
  over()   { [523, 392, 311, 196].forEach((f, i) => setTimeout(() => this.tone(f, .35, 'sawtooth', .11), i * 220)); }
};

/* ================= 输入 ================= */
const keys = new Set();
const ptr = { x: W / 2, y: H - 120, down: false, used: false };

addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (!e.repeat) onKey(e);
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { if (game.state === 'play') game.state = 'pause'; keys.clear(); ptr.down = false; });

function setPtr(e) {
  const r = cv.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) * W / r.width;
  ptr.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('pointerdown', e => {
  SFX.ensure();
  ptr.down = true; ptr.used = true; setPtr(e);
  if (game.state === 'menu' || game.state === 'over') startGame();
});
cv.addEventListener('pointermove', e => { if (ptr.down) setPtr(e); });
addEventListener('pointerup', () => ptr.down = false);
addEventListener('pointercancel', () => ptr.down = false);

function onKey(e) {
  SFX.ensure();
  if (e.code === 'KeyM') SFX.muted = !SFX.muted;
  if (e.code === 'KeyX' || e.code === 'KeyB') useBomb();
  if ((game.state === 'menu' || game.state === 'over') && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (game.state === 'play' && (e.code === 'KeyP' || e.code === 'Escape')) { game.state = 'pause'; game.beamOn = false; }
  else if (game.state === 'pause' && (e.code === 'KeyP' || e.code === 'Escape' || e.code === 'Space')) game.state = 'play';
}

/* ================= 游戏状态 ================= */
let hi = 0;
try { hi = +(localStorage.getItem('skyHi') || 0); } catch (e) {}
function saveHi() { try { localStorage.setItem('skyHi', hi); } catch (e) {} }

const game = { state: 'menu', score: 0, hi, lives: 3, wave: 0, weaponType: 'spread', power: 1, bombs: 3, beamOn: false, homingOn: false, homingTarget: null, lockTime: 0, beamGeom: null, flash: 0, shield: false, shake: 0, time: 0, waveMsg: 0, newHi: false };
const player = { x: W / 2, y: H - 90, r: 11, speed: 300, cd: 0, inv: 0, tilt: 0 };

let pBullets = [], eBullets = [], enemies = [], powerups = [], parts = [], floats = [];
let spawnQueue = [], waveDelay = 2;

function startGame() {
  game.state = 'play'; game.score = 0; game.lives = 3; game.wave = 0;
  game.weaponType = 'spread'; game.power = 1; game.bombs = 3;
  game.beamOn = false; game.homingOn = false; game.homingTarget = null; game.lockTime = 0; game.beamGeom = null;
  game.flash = 0; game.shield = false; game.shake = 0; game.newHi = false;
  player.x = W / 2; player.y = H - 90; player.cd = 0; player.inv = 1;
  pBullets = []; eBullets = []; enemies = []; powerups = []; parts = []; floats = [];
  spawnQueue = []; waveDelay = 2;
  startWave(1);
}

/* ================= 波次与敌机 ================= */
function startWave(n) {
  game.wave = n; game.waveMsg = 2.2;
  SFX.waveS();
  spawnQueue = [];
  if (n % 5 === 0) {                       // 每 5 波一个 BOSS
    spawnQueue.push({ t: 1.4, type: 'boss', hp: 140 + n * 30 });
    for (let i = 0; i < 4 + n; i++) spawnQueue.push({ t: 2.4 + i * .9, type: 'grunt', x: rand(60, W - 60) });
    return;
  }
  const count = 6 + Math.min(16, n * 2);
  for (let i = 0; i < count; i++) {
    let type = 'grunt';
    if (n >= 2 && i % 5 === 4) type = 'zig';
    if (n >= 3 && i % 7 === 6) type = 'tank';
    if (n >= 2 && i % 4 === 3) type = 'dive';
    spawnQueue.push({ t: i * Math.max(.35, 1.1 - n * .05), type, x: rand(50, W - 50) });
  }
}

function spawnEnemy(s) {
  if (s.type === 'boss') {
    enemies.push({ kind: 'boss', x: W / 2, y: -80, r: 46, hp: s.hp, maxHp: s.hp, t: 0, dir: 1, fireT: 1.6, flash: 0 });
    return;
  }
  const x = s.x != null ? s.x : rand(50, W - 50);
  if (s.type === 'grunt') enemies.push({ kind: 'grunt', x, y: -24, r: 14, hp: 4, t: rand(0, TAU), vy: 90 + game.wave * 6, fireT: rand(1.5, 4), flash: 0 });
  if (s.type === 'zig')   enemies.push({ kind: 'zig',   x, y: -24, r: 13, hp: 7, t: rand(0, TAU), vy: 130 + game.wave * 7, fireT: rand(1.5, 3.5), flash: 0 });
  if (s.type === 'tank')  enemies.push({ kind: 'tank',  x, y: -30, r: 22, hp: 14 + game.wave * 3, maxHp: 14 + game.wave * 3, t: 0, vy: 55, fireT: rand(1, 2.5), flash: 0 });
  if (s.type === 'dive')  enemies.push({ kind: 'dive',  x, y: -24, r: 12, hp: 4, t: 0, vy: 120, tx: player.x, diving: false, flash: 0 });
}

function eBullet(x, y, vx, vy) { eBullets.push({ x, y, vx, vy, r: 5 }); }

function shootAt(e, speed, off) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const a = Math.atan2(dy, dx) + (off || 0);
  eBullet(e.x, e.y + e.r * .6, Math.cos(a) * speed, Math.sin(a) * speed);
}

function updateWave(dt) {
  for (const s of spawnQueue) s.t -= dt;
  while (spawnQueue.length && spawnQueue[0].t <= 0) spawnEnemy(spawnQueue.shift());
  if (!spawnQueue.length && !enemies.length) {
    waveDelay -= dt;
    if (waveDelay <= 0) { startWave(game.wave + 1); waveDelay = 2; }
  } else waveDelay = 1.8;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.kind === 'grunt') {
      e.y += e.vy * dt; e.x += Math.sin(e.t * 2) * 40 * dt;
      if ((e.fireT -= dt) <= 0 && e.y > 0) { e.fireT = rand(2, 4.5); shootAt(e, 180); }
    } else if (e.kind === 'zig') {
      e.y += e.vy * dt; e.x += Math.sin(e.t * 4) * 130 * dt;
      if ((e.fireT -= dt) <= 0 && e.y > 0) { e.fireT = rand(1.6, 3); shootAt(e, 200); }
    } else if (e.kind === 'tank') {
      e.y += e.vy * dt;
      if ((e.fireT -= dt) <= 0 && e.y > 30) { e.fireT = 1.6; for (let i = -1; i <= 1; i++) shootAt(e, 150, i * .3); }
    } else if (e.kind === 'dive') {
      if (!e.diving) { e.y += 100 * dt; if (e.y > 60) { e.diving = true; e.tx = player.x; } }
      else {
        const dx = e.tx - e.x;
        e.x += clamp(dx, -260 * dt, 260 * dt);
        e.y += (200 + game.wave * 10) * dt;
      }
    } else if (e.kind === 'boss') {
      if (e.y < 110) e.y += 60 * dt;
      else {
        e.x += e.dir * (50 + game.wave * 3) * dt;
        if (e.x < 60 || e.x > W - 60) e.dir *= -1;
        if ((e.fireT -= dt) <= 0) {
          e.fireT = 1.4;
          const pat = (Math.random() * 3) | 0;
          if (pat === 0) {
            for (let i = 0; i < 7; i++) {
              const a = Math.PI / 2 + (i - 3) * .22;
              eBullet(e.x, e.y + 28, Math.cos(a) * 170, Math.sin(a) * 170);
            }
          } else if (pat === 1) {
            for (let i = -1; i <= 1; i++) shootAt(e, 210, i * .35);
          } else {
            const vx = (player.x - e.x) * .25;
            eBullet(e.x - 30, e.y + 20, vx, 170);
            eBullet(e.x + 30, e.y + 20, vx, 170);
          }
        }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.y < H + 70);
}

function damageEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg; e.flash = .08;
  if (e.hp <= 0) {
    const base = e.kind === 'boss' ? 500 : e.kind === 'tank' ? 120 : e.kind === 'zig' ? 40 : 20;
    addScore(base, e.x, e.y);
    explode(e.x, e.y, e.kind === 'boss' ? 70 : e.kind === 'tank' ? 40 : 24);
    if (e.kind === 'boss') {
      SFX.bigBoom(); game.shake = 14;
      eBullets.length = 0;
      dropPower(e.x - 28, e.y); dropPower(e.x + 28, e.y);
    } else {
      SFX.boom();
      if (Math.random() < .14) dropPower(e.x, e.y);
    }
  }
}

/* ================= 道具 ================= */
function dropPower(x, y) {
  const r = Math.random();
  const k = r < .18 ? 'V' : r < .36 ? 'L' : r < .54 ? 'T' : r < .70 ? 'B' : r < .85 ? 'S' : 'H';
  powerups.push({ x, y, r: 12, k, t: rand(0, TAU) });
}
function applyPower(k) {
  SFX.power();
  const names = { spread: '散弹', laser: '激光', homing: '跟踪激光' };
  if (k === 'V' || k === 'L' || k === 'T') {
    const t = k === 'V' ? 'spread' : k === 'L' ? 'laser' : 'homing';
    if (game.weaponType === t) {
      if (game.power < 8) { game.power++; addFloat('火力 Lv' + game.power + '!', player.x, player.y - 34, '#7dff8a', 16); }
      else addScore(200, player.x, player.y - 34);
    } else {
      game.weaponType = t;
      addFloat('切换 ' + names[t] + '!', player.x, player.y - 34, '#c9d6ff', 16);
    }
  } else if (k === 'B') {
    if (game.bombs < 7) { game.bombs++; addFloat('炸弹 +1', player.x, player.y - 34, '#ffd23d', 16); }
    else addScore(200, player.x, player.y - 34);
  } else if (k === 'H') {
    if (game.lives < 5) { game.lives++; addFloat('+1 生命', player.x, player.y - 34, '#ff7d9d', 16); }
    else addScore(200, player.x, player.y - 34);
  } else {
    game.shield = true;
    addFloat('护盾!', player.x, player.y - 34, '#6dc7ff', 16);
  }
}

/* ================= 玩家 ================= */
function pBullet(x, y, vx, vy, dmg) { pBullets.push({ x, y, vx, vy, r: 4, dmg: dmg || 1 }); }

function useBomb() {
  if (game.state !== 'play' || game.bombs <= 0) return;
  game.bombs--; game.flash = .5; game.shake = 16;
  player.inv = Math.max(player.inv, 1.5);
  SFX.bigBoom(); SFX.tone(200, .5, 'sine', .15, 600);
  ring(player.x, player.y, '#ffd23d'); ring(player.x, player.y, '#ffffff');
  let n = 0;
  for (const b of eBullets) {                    // 敌弹化作金色火花
    if (n++ < 60) parts.push({ x: b.x, y: b.y, vx: rand(-60, 60), vy: rand(-60, 60), life: .4, max: .4, r: 2, c: '#ffd23d' });
  }
  eBullets = [];
  for (const e of enemies) if (e.hp > 0) damageEnemy(e, 30);
}

function updateWeapons(dt) {
  const firing = keys.has('Space') || keys.has('KeyJ') || ptr.down;
  game.beamOn = false; game.homingOn = false;
  if (!firing) { game.homingTarget = null; game.beamGeom = null; return; }
  const x = player.x, y = player.y - 14;
  const sp = 560 + game.power * 10;
  if (game.weaponType === 'laser') {             // 蓝色贯穿激光:持续伤害光束
    game.beamOn = true;
    const half = (4 + game.power * 2.5) / 2;
    const dps = 10 + game.power * 4;
    for (const e of enemies) {
      if (e.hp > 0 && e.y < player.y && Math.abs(e.x - player.x) < half + e.r) damageEnemy(e, dps * dt);
    }
    return;
  }
  if (game.weaponType === 'homing') {            // 紫色跟踪激光:锁定敌机,无敌人时直射上方
    let t = game.homingTarget;
    if (t && t.hp <= 0) t = null;
    if (!t) {
      let bd = 1e18;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
        if (d < bd) { bd = d; t = e; }
      }
      game.lockTime = 0;
    } else game.lockTime += dt;                  // 锁定越久光束越绷直
    game.homingTarget = t;
    game.homingOn = true;                        // 无敌人也保持光束(向上)
    const x0 = player.x, y0 = player.y - 12;
    let x1, y1, cx, cy;
    if (t) {
      const bow = (1 - Math.min(1, game.lockTime * 2.5)) * 110;
      const mx = (x0 + t.x) / 2, my = (y0 + t.y) / 2;
      const dx = t.x - x0, dy = t.y - y0, dd = Math.hypot(dx, dy) || 1;
      cx = mx + (-dy / dd) * bow; cy = my + (dx / dd) * bow;
      x1 = t.x; y1 = t.y;
    } else {
      x1 = x0; y1 = -10; cx = x0; cy = y0 - 60;
    }
    game.beamGeom = { x0, y0, cx, cy, x1, y1 };
    // 光束是"实体"的:路径上的敌机都掉血(锁定目标全额,路过目标 60%)
    const half = (2.5 + game.power * 1.3) / 2;
    const dps = 7 + game.power * 3;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      for (let i = 0; i <= 28; i++) {
        const u = i / 28, a = 1 - u;
        const px = a * a * x0 + 2 * a * u * cx + u * u * x1;
        const py = a * a * y0 + 2 * a * u * cy + u * u * y1;
        if ((px - e.x) ** 2 + (py - e.y) ** 2 < (half + e.r) ** 2) {
          damageEnemy(e, dps * dt * (e === t ? 1 : .6));
          break;
        }
      }
    }
    return;
  }
  player.cd -= dt;
  if (player.cd > 0) return;
  {                                              // 红色火神炮:扇形散弹
    player.cd = [.22, .22, .19, .16, .13, .12, .11, .10, .09][game.power];
    SFX.shoot();
    if (game.power === 2) { pBullet(x - 8, y, 0, -sp); pBullet(x + 8, y, 0, -sp); return; }
    const cfg = { 1: [1, 0], 3: [3, .35], 4: [4, .5], 5: [5, .7], 6: [6, .9], 7: [7, 1.15], 8: [9, 1.45] }[game.power];
    const [n, spread] = cfg;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (n === 1 ? 0 : (i / (n - 1) - .5) * spread);
      pBullet(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
    }
  }
}

function updatePlayer(dt) {
  player.inv = Math.max(0, player.inv - dt);
  let dx = 0, dy = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) dx--;
  if (keys.has('ArrowRight') || keys.has('KeyD')) dx++;
  if (keys.has('ArrowUp') || keys.has('KeyW')) dy--;
  if (keys.has('ArrowDown') || keys.has('KeyS')) dy++;
  if (dx && dy) { dx *= .707; dy *= .707; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  if (ptr.down && ptr.used) {   // 鼠标/触摸拖动,飞机悬停在手指上方
    player.x += (ptr.x - player.x) * Math.min(1, 12 * dt);
    player.y += (ptr.y - 70 - player.y) * Math.min(1, 12 * dt);
  }
  let tiltT = 0;                // 横移时机身倾斜
  if (dx > 0) tiltT = .2;
  else if (dx < 0) tiltT = -.2;
  else if (ptr.down && ptr.used) tiltT = clamp((ptr.x - player.x) * .004, -.2, .2);
  player.tilt += (tiltT - player.tilt) * Math.min(1, 10 * dt);
  player.x = clamp(player.x, 16, W - 16);
  player.y = clamp(player.y, 40, H - 24);
}

function hitPlayer() {
  if (player.inv > 0) return;
  if (game.shield) {
    game.shield = false; player.inv = 1.2; SFX.hit();
    ring(player.x, player.y, '#6dc7ff');
    addFloat('护盾破碎!', player.x, player.y - 34, '#6dc7ff', 15);
    return;
  }
  game.lives--; SFX.hit(); game.shake = 12;
  explode(player.x, player.y, 40);
  player.inv = 2;
  game.power = Math.max(1, game.power - 1);
  if (game.lives <= 0) {
    game.state = 'over'; game.beamOn = false; SFX.over();
    if (game.score > game.hi) { game.hi = game.score; game.newHi = true; saveHi(); }
  }
}

/* ================= 碰撞 ================= */
function collide() {
  for (const b of pBullets) {
    for (const e of enemies) {
      if (e.hp > 0 && Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
        b.dead = true; damageEnemy(e, b.dmg); break;
      }
    }
  }
  pBullets = pBullets.filter(b => !b.dead && b.y > -20);

  if (player.inv <= 0) {
    for (const b of eBullets) {
      if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r - 2) { b.dead = true; hitPlayer(); break; }
    }
    if (player.inv <= 0) for (const e of enemies) {
      if (e.hp > 0 && Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 2) {
        damageEnemy(e, 3); hitPlayer(); break;
      }
    }
  }
  eBullets = eBullets.filter(b => !b.dead && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  for (const p of powerups) {
    if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + player.r + 6) { p.dead = true; applyPower(p.k); }
  }
  powerups = powerups.filter(p => !p.dead && p.y < H + 20);
}

/* ================= 特效与文字 ================= */
function explode(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(40, 320);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.3, .8), max: .8, r: rand(1.5, 3.5), c: Math.random() < .5 ? '#ff9b3d' : '#ffd23d' });
  }
}
function ring(x, y, c) {
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * TAU;
    parts.push({ x, y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: .5, max: .5, r: 2.5, c });
  }
}
function addScore(n, x, y) {
  game.score += n;
  addFloat('+' + n, x, y, '#ffffff', 12);
}
function addFloat(t, x, y, c, size) { floats.push({ t, x, y, c, size, life: 1 }); }

function updateFx(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 36 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
}

/* ================= 背景 ================= */
const stars = [];
for (let i = 0; i < 120; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: rand(.3, 1) });
function updateStars(dt) {
  const sp = game.state === 'play' ? 1 : .4;
  for (const s of stars) {
    s.y += (40 + 140 * s.z) * dt * sp;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
}

/* ================= 主更新 ================= */
function update(dt) {
  game.shake = Math.max(0, game.shake - 50 * dt);
  game.flash = Math.max(0, game.flash - dt * 1.2);
  if (game.waveMsg > 0) game.waveMsg -= dt;
  updatePlayer(dt); updateWeapons(dt);
  updateWave(dt); updateEnemies(dt);
  for (const b of pBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const p of powerups) { p.t += dt; p.y += 90 * dt; p.x += Math.sin(p.t * 3) * 20 * dt; }
  collide();
  updateFx(dt);
}

/* ================= 绘制 ================= */
function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = .3 + .7 * s.z;
    ctx.fillStyle = '#9db4ff';
    const sz = s.z > .8 ? 2 : 1;
    ctx.fillRect(s.x, s.y, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawBeam() {
  if (!game.beamOn || game.state === 'over') return;
  const w = 4 + game.power * 2.5;                // 等级越高光束越粗
  const x = player.x, y0 = player.y - 12;
  ctx.save();
  ctx.globalAlpha = .22;                                   // 外层光晕
  ctx.fillStyle = '#4db8ff';
  ctx.fillRect(x - w, 0, w * 2, y0);
  ctx.globalAlpha = .55;                                   // 蓝色主体
  ctx.fillRect(x - w / 2, 0, w, y0);
  ctx.globalAlpha = .95;                                   // 白色核心
  ctx.fillStyle = '#eef9ff';
  ctx.fillRect(x - w / 5, 0, w * .4, y0);
  ctx.restore();
}

function drawHomingBeam() {
  if (!game.homingOn || game.state === 'over' || !game.beamGeom) return;
  const { x0, y0, cx, cy, x1, y1 } = game.beamGeom;
  const w = 2.5 + game.power * 1.3;              // 等级越高光束越粗
  ctx.save();
  ctx.lineCap = 'round';
  const trace = () => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); };
  ctx.globalAlpha = .3; ctx.strokeStyle = '#c07bff'; ctx.lineWidth = w * 2.4; trace(); ctx.stroke();
  ctx.globalAlpha = .85; ctx.lineWidth = w; trace(); ctx.stroke();
  ctx.globalAlpha = 1; ctx.strokeStyle = '#f3e8ff'; ctx.lineWidth = Math.max(1.2, w * .35); trace(); ctx.stroke();
  ctx.fillStyle = '#e6ccff';                               // 端点光球
  ctx.globalAlpha = .9;
  ctx.beginPath(); ctx.arc(x1, y1, w * .8 + Math.sin(game.time * 25) * 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  if (player.inv > 0 && ((game.time * 12) | 0) % 2 === 0) return;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.tilt);

  // 双层引擎尾焰:蓝色外焰 + 白炽内芯,长度抖动
  const fl = 12 + Math.sin(game.time * 42) * 4;
  ctx.globalAlpha = .8;
  ctx.fillStyle = '#37a6ff';
  ctx.beginPath(); ctx.moveTo(-3.5, 14); ctx.quadraticCurveTo(0, 14 + fl * 1.7, 3.5, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cfeeff';
  ctx.beginPath(); ctx.moveTo(-1.8, 14); ctx.quadraticCurveTo(0, 14 + fl, 1.8, 14); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // 机体:尖头机身 + 后掠翼 + 双尾翼,机头朝上
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(2.5, -11); ctx.lineTo(3, -3);
  ctx.lineTo(14, 4); ctx.lineTo(14.5, 8); ctx.lineTo(4, 7);
  ctx.lineTo(5, 13); ctx.lineTo(9.5, 16); ctx.lineTo(3, 15); ctx.lineTo(0, 12);
  ctx.lineTo(-3, 15); ctx.lineTo(-9.5, 16); ctx.lineTo(-5, 13); ctx.lineTo(-4, 7);
  ctx.lineTo(-14.5, 8); ctx.lineTo(-14, 4); ctx.lineTo(-3, -3); ctx.lineTo(-2.5, -11);
  ctx.closePath();
  ctx.fillStyle = '#dfefff';
  ctx.fill();
  ctx.strokeStyle = '#3d8fd6'; ctx.lineWidth = 1.5; ctx.stroke();

  // 机腹中线阴影,增强立体感
  ctx.fillStyle = 'rgba(61,143,214,.25)';
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(1.6, -10); ctx.lineTo(1.8, 10); ctx.lineTo(0, 13); ctx.lineTo(-1.8, 10); ctx.lineTo(-1.6, -10);
  ctx.closePath(); ctx.fill();

  // 座舱盖 + 高光
  ctx.fillStyle = '#2f7fc4';
  ctx.beginPath(); ctx.ellipse(0, -6, 2.4, 4.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9fd4ff';
  ctx.beginPath(); ctx.ellipse(-.7, -7.5, .9, 1.8, 0, 0, TAU); ctx.fill();

  // 翼尖航行灯:左红右绿,交替闪烁
  const blink = Math.sin(game.time * 6) > 0;
  ctx.fillStyle = blink ? '#ff5d6c' : 'rgba(255,93,108,.25)';
  ctx.beginPath(); ctx.arc(-13.5, 6.5, 1.6, 0, TAU); ctx.fill();
  ctx.fillStyle = blink ? '#69f0a0' : 'rgba(105,240,160,.25)';
  ctx.beginPath(); ctx.arc(13.5, 6.5, 1.6, 0, TAU); ctx.fill();

  if (game.shield) {
    ctx.strokeStyle = 'rgba(109,199,255,.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 22 + Math.sin(game.time * 6) * 1.5, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function planePath(kind) {                       // 飞机剪影:机头朝下(朝向玩家)
  ctx.beginPath();
  if (kind === 'grunt') {                        // 小型战斗机
    ctx.moveTo(0, 15); ctx.lineTo(3, 7); ctx.lineTo(4, 0); ctx.lineTo(13, -5); ctx.lineTo(13, -8);
    ctx.lineTo(4, -7); ctx.lineTo(3, -13); ctx.lineTo(-3, -13); ctx.lineTo(-4, -7); ctx.lineTo(-13, -8);
    ctx.lineTo(-13, -5); ctx.lineTo(-4, 0); ctx.lineTo(-3, 7); ctx.closePath();
  } else if (kind === 'zig') {                   // 三角翼快机
    ctx.moveTo(0, 15); ctx.lineTo(4, 4); ctx.lineTo(16, -3); ctx.lineTo(16, -7); ctx.lineTo(4, -5);
    ctx.lineTo(3, -12); ctx.lineTo(-3, -12); ctx.lineTo(-4, -5); ctx.lineTo(-16, -7); ctx.lineTo(-16, -3);
    ctx.lineTo(-4, 4); ctx.closePath();
  } else if (kind === 'tank') {                  // 重型轰炸机
    ctx.moveTo(0, 18); ctx.lineTo(5, 10); ctx.lineTo(6, 2); ctx.lineTo(21, -2); ctx.lineTo(21, -8);
    ctx.lineTo(7, -8); ctx.lineTo(5, -15); ctx.lineTo(-5, -15); ctx.lineTo(-7, -8); ctx.lineTo(-21, -8);
    ctx.lineTo(-21, -2); ctx.lineTo(-6, 2); ctx.lineTo(-5, 10); ctx.closePath();
  } else if (kind === 'dive') {                  // 俯冲拦截机
    ctx.moveTo(0, 16); ctx.lineTo(4, 6); ctx.lineTo(11, 0); ctx.lineTo(11, -4); ctx.lineTo(4, -6);
    ctx.lineTo(7, -13); ctx.lineTo(2, -9); ctx.lineTo(0, -14); ctx.lineTo(-2, -9); ctx.lineTo(-7, -13);
    ctx.lineTo(-4, -6); ctx.lineTo(-11, -4); ctx.lineTo(-11, 0); ctx.lineTo(-4, 6); ctx.closePath();
  } else if (kind === 'boss') {                  // 巨型旗舰轰炸机
    ctx.moveTo(0, 42); ctx.lineTo(9, 30); ctx.lineTo(12, 10); ctx.lineTo(58, -4); ctx.lineTo(62, -16);
    ctx.lineTo(14, -12); ctx.lineTo(10, -28); ctx.lineTo(-10, -28); ctx.lineTo(-14, -12); ctx.lineTo(-62, -16);
    ctx.lineTo(-58, -4); ctx.lineTo(-12, 10); ctx.lineTo(-9, 30); ctx.closePath();
  }
}

function drawEnemies() {
  const colors = { grunt: '#ff5d6c', zig: '#c07bff', tank: '#ffb347', dive: '#ff7dd8', boss: '#ff5d6c' };
  const darks  = { grunt: '#7a1622', zig: '#43226b', tank: '#7a4a10', dive: '#6e2a5e', boss: '#5e1620' };
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const boss = e.kind === 'boss';
    const engY = boss ? -34 : e.kind === 'tank' ? -17 : -14;   // 机尾引擎光
    const engXs = boss ? [-18, 18, 0] : [0];
    ctx.fillStyle = 'rgba(130,200,255,.6)';
    for (const ex of engXs) {
      ctx.beginPath(); ctx.arc(ex, engY, (boss ? 7 : 3) + Math.sin(e.t * 25 + ex) * 1, 0, TAU); ctx.fill();
    }
    planePath(e.kind);
    ctx.fillStyle = colors[e.kind]; ctx.fill();
    ctx.strokeStyle = darks[e.kind]; ctx.lineWidth = 2; ctx.stroke();
    if (e.flash > 0) { ctx.fillStyle = '#fff'; ctx.fill(); }
    ctx.fillStyle = 'rgba(12,22,52,.78)';                    // 座舱
    if (boss) {
      ctx.beginPath(); ctx.ellipse(0, 14, 10, 15, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = darks.boss;                            // 机身中线与炮塔
      ctx.fillRect(-4, -26, 8, 52);
      ctx.beginPath(); ctx.arc(-30, 6, 7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(30, 6, 7, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(0, e.kind === 'tank' ? 4 : 3, 2.6, 5, 0, 0, TAU); ctx.fill();
    }
    if (e.kind === 'tank' && e.hp < e.maxHp) {
      ctx.strokeStyle = '#ffe9c4'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 24, -Math.PI / 2, -Math.PI / 2 + TAU * e.hp / e.maxHp); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBullets() {
  for (const b of pBullets) {                    // 火神炮:青色弹丸
    ctx.fillStyle = '#7df9ff';
    ctx.globalAlpha = .3; ctx.fillRect(b.x - 3, b.y - 9, 6, 16);
    ctx.globalAlpha = 1;  ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14);
  }
  for (const b of eBullets) {
    ctx.fillStyle = '#ff6d8d';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe3ea';
    ctx.beginPath(); ctx.arc(b.x - 1, b.y - 1, 2, 0, TAU); ctx.fill();
  }
}

function drawPowerups() {
  const colors = { V: '#ff6d6d', L: '#6db8ff', T: '#c07bff', B: '#ffd23d', H: '#ff7d9d', S: '#6dc7ff' };
  for (const p of powerups) {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.globalAlpha = .35;
    ctx.fillStyle = colors[p.k];
    ctx.beginPath(); ctx.arc(0, 0, 15 + Math.sin(p.t * 6) * 2, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0b1030';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.k, 0, 1);
    ctx.restore();
  }
}

function drawFx() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = f.c;
    ctx.font = 'bold ' + f.size + 'px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.t, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = 'rgba(8,10,26,.55)';
  ctx.fillRect(0, 0, W, 34);
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText('得分 ' + game.score, 12, 18);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd23d';
  ctx.fillText('最高 ' + game.hi, W - 12, 18);

  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#9db4ff';
  ctx.fillText('第 ' + game.wave + ' 波', 12, 48);
  const wNames = { spread: '散弹', laser: '激光', homing: '跟踪激光' };
  const wColors = { spread: '#ff6d6d', laser: '#6db8ff', homing: '#c07bff' };
  ctx.fillStyle = wColors[game.weaponType];
  const wtxt = wNames[game.weaponType] + ' Lv' + game.power;
  ctx.fillText(wtxt, 82, 48);
  if (game.shield) { ctx.fillStyle = '#6dc7ff'; ctx.fillText('◈ 护盾', 92 + ctx.measureText(wtxt).width, 48); }
  ctx.font = '15px sans-serif';
  const hearts = '♥'.repeat(Math.max(0, game.lives));
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff5d6c';
  ctx.fillText(hearts, W - 12, 48);
  if (game.bombs > 0) {
    ctx.fillStyle = '#ffd23d';
    ctx.fillText('◉'.repeat(game.bombs), W - 24 - ctx.measureText(hearts).width, 48);
  }

  const boss = enemies.find(e => e.kind === 'boss');
  if (boss && boss.y > 0) {
    ctx.fillStyle = 'rgba(255,93,108,.25)';
    ctx.fillRect(60, 62, W - 120, 8);
    ctx.fillStyle = '#ff5d6c';
    ctx.fillRect(60, 62, (W - 120) * Math.max(0, boss.hp / boss.maxHp), 8);
    ctx.fillStyle = '#ffb3bb'; ctx.font = '11px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('BOSS', W / 2, 80);
  }
}

function drawWaveBanner() {
  if (game.waveMsg <= 0) return;
  ctx.globalAlpha = Math.min(1, game.waveMsg);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const boss = game.wave % 5 === 0;
  ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = boss ? '#ff5d6c' : '#7df9ff';
  ctx.fillText(boss ? '⚠ BOSS 来袭 ⚠' : '第 ' + game.wave + ' 波', W / 2, 300);
  ctx.globalAlpha = 1;
}

function drawMenu() {
  ctx.fillStyle = 'rgba(5,6,15,.5)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#7df9ff';
  ctx.font = 'bold 46px "Microsoft YaHei", sans-serif';
  ctx.fillText('星空保卫战', W / 2, 210);
  ctx.fillStyle = '#9db4ff';
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillText('GLM 周末版 · 致敬雷电 2', W / 2, 254);

  ctx.font = '14px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#c9d6ff';
  const lines = [
    '←→↑↓ / WASD 移动  ·  空格 射击  ·  X 炸弹',
    '鼠标或手指拖动也可以(自动开火)',
    'P 暂停  ·  M 静音',
    '武器:V 散弹 · L 激光 · T 跟踪激光(吃同色升级,最高 Lv8)',
    'B 炸弹清屏  ·  S 护盾  ·  ♥ 生命  ·  每 5 波一个 BOSS'
  ];
  lines.forEach((t, i) => ctx.fillText(t, W / 2, 330 + i * 30));

  if (((game.time * 2) | 0) % 2 === 0) {
    ctx.fillStyle = '#ffd23d';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.fillText('按 空格 或 点击屏幕 开始', W / 2, 540);
  }
  ctx.fillStyle = '#5a6a9a';
  ctx.font = '13px "Microsoft YaHei", sans-serif';
  ctx.fillText('最高纪录:' + game.hi, W / 2, 600);
}

function drawPause() {
  ctx.fillStyle = 'rgba(5,6,15,.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';
  ctx.fillText('已暂停', W / 2, 330);
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#9db4ff';
  ctx.fillText('按 P 或 Esc 继续', W / 2, 380);
}

function drawOver() {
  ctx.fillStyle = 'rgba(5,6,15,.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5d6c';
  ctx.font = 'bold 42px "Microsoft YaHei", sans-serif';
  ctx.fillText('游戏结束', W / 2, 250);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
  ctx.fillText('得分 ' + game.score, W / 2, 330);
  if (game.newHi && ((game.time * 3) | 0) % 2 === 0) {
    ctx.fillStyle = '#ffd23d';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.fillText('★ 新纪录 ★', W / 2, 375);
  }
  ctx.fillStyle = '#9db4ff';
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillText('坚持到第 ' + game.wave + ' 波 · 最高纪录 ' + game.hi, W / 2, 430);
  if (((game.time * 2) | 0) % 2 === 0) {
    ctx.fillStyle = '#ffd23d';
    ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
    ctx.fillText('按 空格 或 点击 再来一局', W / 2, 500);
  }
}

function draw() {
  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-1, 1) * game.shake * .5, rand(-1, 1) * game.shake * .5);
  ctx.clearRect(-20, -20, W + 40, H + 40);
  drawStars();
  if (game.state !== 'menu') {
    drawPowerups();
    drawEnemies();
    drawBeam();
    drawHomingBeam();
    if (game.state !== 'over') drawPlayer();
    drawBullets();
  }
  drawFx();
  ctx.restore();

  if (game.flash > 0) {                        // 炸弹白闪
    ctx.fillStyle = 'rgba(255,244,214,' + Math.min(.8, game.flash * 1.6).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (game.state === 'play') { drawHUD(); drawWaveBanner(); }
  else if (game.state === 'menu') drawMenu();
  else if (game.state === 'pause') { drawHUD(); drawPause(); }
  else if (game.state === 'over') { drawHUD(); drawOver(); }
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000);
  last = now;
  game.time += dt;
  updateStars(dt);
  if (game.state === 'play') update(dt);
  else if (game.state === 'menu' || game.state === 'over') updateFx(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
